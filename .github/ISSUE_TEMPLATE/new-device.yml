name: New device report
description: A frame or display that isn't documented yet.
title: "New device: <brand model> (<SoC>, Android <version>)"
labels: ["new device"]
body:
  - type: markdown
    attributes:
      value: |
        Check the README's "Which frame do you have?" list and open issues first.
        **Do not include** serials, MAC addresses, Wi-Fi details, account IDs, firmware dumps or vendor APKs.
  - type: input
    id: device
    attributes: { label: Brand, model and where you bought it }
    validations: { required: true }
  - type: textarea
    id: identity
    attributes:
      label: Identity
      description: About screen (model, firmware/build), SoC, Android version, USB IDs, home/vendor app package.
    validations: { required: true }
  - type: textarea
    id: adb
    attributes:
      label: ADB
      description: Out of the box over USB? Over the network (port 5555)? Any prompt on screen? What you tried.
  - type: textarea
    id: notes
    attributes:
      label: What worked, what failed
      description: Root, backup, launcher, WebView version, anything unusual. Keep observations separate from guesses.
