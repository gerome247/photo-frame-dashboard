name: PF1007L unit report
description: Report results from the PF1007L (Allwinner A33, AiMOR) test sequence, passed or failed.
title: "PF1007L report: firmware <date>, <result>"
labels: ["pf1007l", "unit report"]
body:
  - type: markdown
    attributes:
      value: |
        Run the tests in [pf1007l-start-here.md](https://github.com/wesbos/photo-frame-dashboard/blob/main/docs/pf1007l-start-here.md) and fill in what you have.
        **Do not include** serials, MAC addresses, Wi-Fi details, eMMC CIDs or hashes of the whole eMMC. The boot image SHA-256 is a firmware hash and is fine.
  - type: input
    id: firmware
    attributes: { label: About screen model and firmware string }
    validations: { required: true }
  - type: input
    id: aimor
    attributes: { label: AiMOR version }
  - type: input
    id: ports
    attributes: { label: Ports (DC jack, or USB-C only) and the cable/port that gave USB data }
  - type: textarea
    id: adb
    attributes:
      label: ADB tests (T3 USB, T3b network)
      description: USB IDs seen, `adb devices -l` output, and the port 5555 result.
  - type: textarea
    id: route
    attributes:
      label: Route and storage
      description: sunxi-fel version output, eMMC size in sectors, boot partition start, boot image SHA-256, route used (U or S), U-Boot changes needed.
  - type: input
    id: host
    attributes: { label: Host OS }
  - type: textarea
    id: result
    attributes:
      label: Result, or first failed step with its exact output
    validations: { required: true }
